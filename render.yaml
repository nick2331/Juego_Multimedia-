services:
  # ── Backend API ────────────────────────────────────────────────
  - type: web
    name: phobia-horror-api
    runtime: node
    rootDir: server
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
    plan: free

  # ── Frontend Static Site ───────────────────────────────────────
  - type: web
    name: phobia-horror-client
    runtime: static
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /api/*
        destination: https://phobia-horror-api.onrender.com/api/$1
      - type: rewrite
        source: /*
        destination: /index.html
    plan: free
